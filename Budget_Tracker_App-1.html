<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Budget Tracker</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brandNavy: '#0f172a',
                        brandBlue: '#3b82f6',
                        expense: '#ef4444', // Strict Red
                        income: '#10b981'   // Strict Green
                    }
                }
            }
        }
    </script>

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            background-color: #f8fafc;
            color: #0f172a;
        }
        main {
            /* Standard padding, no longer accommodating a bottom nav */
            padding-bottom: calc(env(safe-area-inset-bottom) + 20px);
        }
        
        .form-input {
            width: 100%;
            padding: 0.75rem 0.875rem;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            color: #0f172a;
            font-size: 0.875rem;
            transition: all 0.2s ease;
            appearance: none;
        }
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 0.375rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .btn-primary {
            width: 100%;
            background-color: #0f172a; 
            color: white;
            font-weight: 500;
            font-size: 0.875rem;
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .tab-btn {
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #64748b;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
            white-space: nowrap;
        }
        .tab-btn.active {
            color: #3b82f6;
            border-bottom-color: #3b82f6;
        }

        .format-radio:checked + div {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        .format-radio:checked + div svg {
            color: #3b82f6;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col">

    <!-- Removed 'sticky' and 'fixed' classes for better iOS local file viewer compatibility -->
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 lg:px-8">
            <div class="flex items-center py-4">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-brandBlue rounded-lg flex items-center justify-center text-white font-bold text-lg shadow-sm">
                        B
                    </div>
                    <h1 class="text-xl font-semibold tracking-tight">Budget Tracker</h1>
                </div>
            </div>
            
            <!-- Top Navigation Tabs (Visible on all screen sizes) -->
            <nav class="flex overflow-x-auto no-scrollbar w-full border-t border-slate-100 pt-1">
                <button class="tab-btn nav-btn-dashboard active flex-1 text-center" onclick="switchTab('dashboard')">Dashboard</button>
                <button class="tab-btn nav-btn-manage flex-1 text-center" onclick="switchTab('manage')">Manage</button>
                <button class="tab-btn nav-btn-reports flex-1 text-center" onclick="switchTab('reports')">Reports</button>
            </nav>
        </div>
    </header>

    <main class="flex-grow w-full max-w-6xl mx-auto px-4 lg:px-8 py-6">
        
        <!-- DASHBOARD VIEW -->
        <div id="view-dashboard" class="space-y-6 block">
            <section class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                    <h3 class="text-slate-500 text-[0.65rem] font-bold uppercase tracking-wider mb-1">Total Balance</h3>
                    <p id="stat-balance" class="text-2xl font-bold truncate">₹0.00</p>
                </div>
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                    <h3 class="text-slate-500 text-[0.65rem] font-bold uppercase tracking-wider mb-1">Accounts</h3>
                    <p id="stat-accounts" class="text-2xl font-bold">0</p>
                </div>
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm hidden lg:block">
                    <h3 class="text-slate-500 text-[0.65rem] font-bold uppercase tracking-wider mb-1">Categories</h3>
                    <p id="stat-categories" class="text-2xl font-bold">0</p>
                </div>
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm hidden lg:block">
                    <h3 class="text-slate-500 text-[0.65rem] font-bold uppercase tracking-wider mb-1">Transactions</h3>
                    <p id="stat-transactions" class="text-2xl font-bold">0</p>
                </div>
            </section>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <section class="lg:col-span-1">
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                        <h2 class="text-base font-semibold mb-4">Record Transaction</h2>
                        <form id="form-transaction" class="space-y-4">
                            <div>
                                <label for="trans-type" class="form-label">Type</label>
                                <select id="trans-type" class="form-input font-medium" required onchange="handleTransactionTypeChange()">
                                    <option value="expense" selected>Expense</option>
                                    <option value="income">Income</option>
                                    <option value="transfer">Transfer</option>
                                </select>
                            </div>
                            
                            <div>
                                <label for="trans-amount" class="form-label">Amount (₹)</label>
                                <input type="number" id="trans-amount" class="form-input text-lg font-bold" placeholder="0.00" step="0.01" required min="0.01">
                            </div>

                            <div>
                                <label id="label-trans-account" for="trans-account" class="form-label">Account</label>
                                <select id="trans-account" class="form-input" required>
                                    <option value="" disabled selected>Select Account</option>
                                </select>
                            </div>

                            <div id="trans-account-to-wrapper" class="hidden">
                                <label for="trans-account-to" class="form-label">To Account</label>
                                <select id="trans-account-to" class="form-input">
                                    <option value="" disabled selected>Select Destination</option>
                                </select>
                            </div>

                            <div id="trans-category-wrapper">
                                <label for="trans-category" class="form-label">Category</label>
                                <select id="trans-category" class="form-input" required>
                                    <option value="" disabled selected>Select Category</option>
                                </select>
                            </div>

                            <div>
                                <label for="trans-notes" class="form-label">Notes</label>
                                <input type="text" id="trans-notes" class="form-input" placeholder="Optional details">
                            </div>
                            
                            <div class="pt-2">
                                <button type="submit" id="btn-save-trans" class="btn-primary">Save Transaction</button>
                            </div>
                        </form>
                    </div>
                </section>

                <section class="lg:col-span-2">
                    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden flex flex-col h-full min-h-[400px]">
                        <div class="p-5 border-b border-slate-200 bg-slate-50">
                            <h2 class="text-base font-semibold">Recent Activity</h2>
                        </div>
                        <div class="overflow-x-auto no-scrollbar flex-grow">
                            <table class="w-full text-left text-sm whitespace-nowrap">
                                <thead class="bg-white border-b border-slate-100 text-slate-400">
                                    <tr>
                                        <th class="px-5 py-3 font-semibold uppercase tracking-wider text-[0.65rem]">Date</th>
                                        <th class="px-5 py-3 font-semibold uppercase tracking-wider text-[0.65rem]">Details</th>
                                        <th class="px-5 py-3 font-semibold uppercase tracking-wider text-[0.65rem]">Account</th>
                                        <th class="px-5 py-3 font-semibold uppercase tracking-wider text-[0.65rem] text-right">Amount</th>
                                    </tr>
                                </thead>
                                <tbody id="transactions-tbody" class="divide-y divide-slate-50">
                                    <!-- Populated by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </div>

        <!-- MANAGE VIEW -->
        <div id="view-manage" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Manage Accounts -->
                <section>
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm h-full flex flex-col">
                        <h3 class="text-base font-semibold mb-4">Add Account</h3>
                        <form id="form-account" class="space-y-4 mb-6">
                            <div>
                                <label for="acc-name" class="form-label">Account Name</label>
                                <input type="text" id="acc-name" class="form-input" placeholder="e.g. Wallet, Bank" required>
                            </div>
                            <div>
                                <label for="acc-balance" class="form-label">Initial Balance (₹)</label>
                                <input type="number" id="acc-balance" class="form-input" placeholder="0.00" step="0.01" required>
                            </div>
                            <div class="pt-2">
                                <button type="submit" id="btn-save-acc" class="btn-primary">Save Account</button>
                            </div>
                        </form>
                        
                        <div class="mt-auto pt-5 border-t border-slate-100">
                            <h4 class="text-[0.65rem] font-bold text-slate-400 uppercase tracking-wider mb-3">Your Accounts</h4>
                            <ul id="accounts-list" class="space-y-3 text-sm"></ul>
                        </div>
                    </div>
                </section>

                <!-- Manage Categories -->
                <section>
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm h-full flex flex-col">
                        <h3 class="text-base font-semibold mb-4">Add Category</h3>
                        <form id="form-category" class="space-y-4 mb-6">
                            <div>
                                <label for="cat-name" class="form-label">Category Name</label>
                                <input type="text" id="cat-name" class="form-input" placeholder="e.g. Groceries" required>
                            </div>
                            <div>
                                <label for="cat-type" class="form-label">Type</label>
                                <select id="cat-type" class="form-input" required>
                                    <option value="expense">Expense</option>
                                    <option value="income">Income</option>
                                </select>
                            </div>
                            <div class="pt-2">
                                <button type="submit" id="btn-save-cat" class="btn-primary">Save Category</button>
                            </div>
                        </form>

                        <div class="mt-auto pt-5 border-t border-slate-100">
                            <h4 class="text-[0.65rem] font-bold text-slate-400 uppercase tracking-wider mb-3">Your Categories</h4>
                            <ul id="categories-list" class="space-y-3 text-sm max-h-48 overflow-y-auto pr-2"></ul>
                        </div>
                    </div>
                </section>
            </div>
        </div>

        <!-- REPORTS VIEW -->
        <div id="view-reports" class="hidden space-y-6">
            <section class="max-w-xl mx-auto lg:mx-0">
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                    <h2 class="text-lg font-semibold mb-4">Generate Report</h2>
                    <form id="form-report" class="space-y-5">
                        <div>
                            <label for="report-type" class="form-label">Report Type</label>
                            <select id="report-type" class="form-input" required>
                                <option value="" disabled selected>Select report...</option>
                                <option value="account_statement">Account Statement</option>
                                <option value="category_summary">Category Summary</option>
                                <option value="income_summary">Income Summary</option>
                                <option value="expense_summary">Expense Summary</option>
                                <option value="transfer_summary">Transfer Summary</option>
                            </select>
                        </div>
                        <div>
                            <label for="report-range" class="form-label">Date Range</label>
                            <select id="report-range" class="form-input" required onchange="handleReportRangeChange()">
                                <option value="today">Today</option>
                                <option value="this_month" selected>This Month</option>
                                <option value="this_year">This Year</option>
                                <option value="custom">Custom Range</option>
                            </select>
                        </div>
                        <div id="custom-date-fields" class="grid grid-cols-2 gap-4 hidden">
                            <div>
                                <label for="date-start" class="form-label">Start Date</label>
                                <input type="date" id="date-start" class="form-input">
                            </div>
                            <div>
                                <label for="date-end" class="form-label">End Date</label>
                                <input type="date" id="date-end" class="form-input">
                            </div>
                        </div>
                        <div>
                            <label class="form-label mb-2">Export Format</label>
                            <div class="grid grid-cols-2 gap-3">
                                <label class="relative cursor-pointer">
                                    <input type="radio" name="export_format" value="pdf" class="peer sr-only format-radio" checked>
                                    <div class="flex flex-col items-center justify-center p-3 border border-slate-200 rounded-lg">
                                        <span class="font-medium text-xs">PDF</span>
                                    </div>
                                </label>
                                <label class="relative cursor-pointer">
                                    <input type="radio" name="export_format" value="excel" class="peer sr-only format-radio">
                                    <div class="flex flex-col items-center justify-center p-3 border border-slate-200 rounded-lg">
                                        <span class="font-medium text-xs">Excel</span>
                                    </div>
                                </label>
                            </div>
                        </div>
                        <div class="pt-2">
                            <button type="submit" id="btn-report" class="btn-primary">Download</button>
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <script>
        // Global navigation function
        function switchTab(targetId) {
            // Hide all views
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-manage').classList.add('hidden');
            document.getElementById('view-reports').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('block');
            document.getElementById('view-manage').classList.remove('block');
            document.getElementById('view-reports').classList.remove('block');
            
            // Show target
            document.getElementById(`view-${targetId}`).classList.remove('hidden');
            document.getElementById(`view-${targetId}`).classList.add('block');
            
            // Update active states for top nav buttons
            const navClasses = ['nav-btn-dashboard', 'nav-btn-manage', 'nav-btn-reports'];
            navClasses.forEach(c => {
                document.querySelectorAll('.' + c).forEach(el => el.classList.remove('active'));
            });
            document.querySelectorAll(`.nav-btn-${targetId}`).forEach(el => el.classList.add('active'));
            
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        // Global form toggle handlers
        function handleTransactionTypeChange() {
            const type = document.getElementById('trans-type').value;
            const catWrapper = document.getElementById('trans-category-wrapper');
            const catSelect = document.getElementById('trans-category');
            const accLabel = document.getElementById('label-trans-account');
            const accToWrapper = document.getElementById('trans-account-to-wrapper');
            const accToSelect = document.getElementById('trans-account-to');

            if (type === 'transfer') {
                catWrapper.classList.add('hidden');
                catSelect.required = false;
                catSelect.value = ""; 
                accLabel.innerText = "From Account";
                accToWrapper.classList.remove('hidden');
                accToSelect.required = true;
            } else {
                catWrapper.classList.remove('hidden');
                catSelect.required = true;
                accLabel.innerText = "Account";
                accToWrapper.classList.add('hidden');
                accToSelect.required = false;
                accToSelect.value = "";
            }
            if (window.renderDropdowns) window.renderDropdowns();
        }

        function handleReportRangeChange() {
            const val = document.getElementById('report-range').value;
            const customFields = document.getElementById('custom-date-fields');
            if (val === 'custom') {
                customFields.classList.remove('hidden');
                document.getElementById('date-start').required = true;
                document.getElementById('date-end').required = true;
            } else {
                customFields.classList.add('hidden');
                document.getElementById('date-start').required = false;
                document.getElementById('date-end').required = false;
            }
        }

        // Main logic wrapped in DOMContentLoaded
        document.addEventListener('DOMContentLoaded', () => {
            const STORAGE_KEY = 'budget_tracker_local_data';
            
            // Initialize state
            let state = { accounts: [], categories: [], transactions: [] };
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    state = JSON.parse(stored);
                    // Migrate old fixed balances to dynamic initial balances
                    state.accounts.forEach(acc => {
                        if (acc.initialBalance === undefined) {
                            acc.initialBalance = acc.balance || 0;
                        }
                    });
                }
            } catch (e) {
                console.error("Local storage access error:", e);
            }

            function saveState() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                } catch (e) {
                    console.error("Failed to save:", e);
                }
                renderAll();
            }

            const generateId = () => Date.now().toString(36) + Math.random().toString(36).substr(2);
            const formatCurrency = (amount) => `₹${parseFloat(amount).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            
            // Calculate dynamic balance based on transactions
            function getAccountBalance(accId) {
                const acc = state.accounts.find(a => a.id === accId);
                if (!acc) return 0;
                let bal = acc.initialBalance || 0;
                
                state.transactions.forEach(txn => {
                    if (txn.type === 'income' && txn.accountId === accId) bal += txn.amount;
                    if (txn.type === 'expense' && txn.accountId === accId) bal -= txn.amount;
                    if (txn.type === 'transfer') {
                        if (txn.fromAccountId === accId) bal -= txn.amount;
                        if (txn.toAccountId === accId) bal += txn.amount;
                    }
                });
                return bal;
            }

            // Expose edit function globally for the native JS prompt
            window.editInitialBalance = function(accId) {
                const acc = state.accounts.find(a => a.id === accId);
                if (!acc) return;
                
                const currentInit = acc.initialBalance || 0;
                const input = prompt(`Enter new initial balance for ${acc.name}:`, currentInit);
                
                if (input !== null) {
                    const newBalance = parseFloat(input);
                    if (!isNaN(newBalance)) {
                        acc.initialBalance = newBalance;
                        saveState(); // saveState calls renderAll() automatically
                    } else {
                        alert("Invalid number entered.");
                    }
                }
            };

            function renderAll() {
                // Stats
                document.getElementById('stat-accounts').innerText = state.accounts.length;
                document.getElementById('stat-categories').innerText = state.categories.length;
                document.getElementById('stat-transactions').innerText = state.transactions.length;

                let totalBalance = 0;
                state.accounts.forEach(acc => totalBalance += getAccountBalance(acc.id));
                const balEl = document.getElementById('stat-balance');
                balEl.innerText = formatCurrency(totalBalance);
                balEl.className = `text-2xl font-bold truncate ${totalBalance < 0 ? 'text-expense' : 'text-brandNavy'}`;

                // Lists
                const accList = document.getElementById('accounts-list');
                accList.innerHTML = state.accounts.length ? '' : '<li class="text-slate-400 italic text-center py-2 text-xs">No accounts.</li>';
                state.accounts.forEach(acc => {
                    const currentBal = getAccountBalance(acc.id);
                    accList.innerHTML += `
                    <li class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-200">
                        <div class="flex flex-col items-start">
                            <span class="font-semibold text-slate-700">${acc.name}</span>
                            <button onclick="editInitialBalance('${acc.id}')" class="text-[0.65rem] text-brandBlue font-medium underline mt-1 active:opacity-70">Edit Initial Balance</button>
                        </div>
                        <span class="font-bold text-sm ${currentBal < 0 ? 'text-expense' : 'text-slate-800'}">${formatCurrency(currentBal)}</span>
                    </li>`;
                });

                const catList = document.getElementById('categories-list');
                catList.innerHTML = state.categories.length ? '' : '<li class="text-slate-400 italic text-center py-2 text-xs">No categories.</li>';
                state.categories.forEach(cat => {
                    const badge = cat.type === 'expense' ? 'bg-red-100 text-expense' : 'bg-green-100 text-income';
                    catList.innerHTML += `
                    <li class="flex justify-between items-center border-b border-slate-100 py-1.5 text-xs">
                        <span class="font-medium">${cat.name}</span>
                        <span class="uppercase font-bold px-1.5 py-0.5 rounded ${badge}">${cat.type}</span>
                    </li>`;
                });

                // Transactions Table
                const tbody = document.getElementById('transactions-tbody');
                tbody.innerHTML = '';
                const sortedTxns = [...state.transactions].sort((a, b) => b.createdAt - a.createdAt);
                
                if (sortedTxns.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="px-5 py-8 text-center text-slate-400 italic text-xs">No activity yet</td></tr>`;
                } else {
                    sortedTxns.slice(0, 15).forEach(txn => {
                        const account = state.accounts.find(a => a.id === (txn.type === 'transfer' ? txn.fromAccountId : txn.accountId))?.name || 'Unknown';
                        let details = '—';
                        
                        if (txn.type === 'transfer') {
                            const toAcc = state.accounts.find(a => a.id === txn.toAccountId)?.name || 'Unknown';
                            details = `<span class="text-brandBlue font-medium text-xs">→ ${toAcc}</span>`;
                        } else if (txn.categoryId) {
                            const cat = state.categories.find(c => c.id === txn.categoryId);
                            if (cat) {
                                const badge = cat.type === 'expense' ? 'bg-red-100 text-expense' : 'bg-green-100 text-income';
                                details = `<span class="text-[0.6rem] uppercase font-bold px-1.5 py-0.5 rounded ${badge}">${cat.name}</span>`;
                            }
                        }

                        const amtClass = txn.type === 'income' ? 'text-income' : (txn.type === 'expense' ? 'text-expense' : '');
                        const sign = txn.type === 'income' ? '+' : (txn.type === 'expense' ? '-' : '');
                        const dateStr = new Date(txn.createdAt).toLocaleDateString('en-IN', {day:'numeric', month:'short'});
                        
                        tbody.innerHTML += `
                            <tr class="border-b border-slate-50 last:border-0">
                                <td class="px-5 py-2.5 text-slate-500 text-xs">${dateStr}</td>
                                <td class="px-5 py-2.5"><div class="flex flex-col gap-0.5">${details}${txn.notes ? `<span class="text-[0.65rem] text-slate-400 truncate max-w-[100px]">${txn.notes}</span>` : ''}</div></td>
                                <td class="px-5 py-2.5 text-xs font-medium text-slate-600">${account}</td>
                                <td class="px-5 py-2.5 text-right text-xs font-bold ${amtClass}">${sign}${formatCurrency(txn.amount)}</td>
                            </tr>`;
                    });
                }
                
                if (window.renderDropdowns) window.renderDropdowns();
            }

            // Expose renderDropdowns globally for the onchange handler
            window.renderDropdowns = function() {
                const type = document.getElementById('trans-type').value;
                const accSelect = document.getElementById('trans-account');
                const accToSelect = document.getElementById('trans-account-to');
                const catSelect = document.getElementById('trans-category');
                
                const selectedAcc = accSelect.value;
                const selectedAccTo = accToSelect.value;
                const selectedCat = catSelect.value;

                accSelect.innerHTML = '<option value="" disabled selected>Select Account</option>' + 
                    state.accounts.map(a => `<option value="${a.id}">${a.name} (${formatCurrency(getAccountBalance(a.id))})</option>`).join('');
                
                accToSelect.innerHTML = '<option value="" disabled selected>Select Destination</option>' + 
                    state.accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
                
                const filteredCats = state.categories.filter(c => c.type === type);
                catSelect.innerHTML = '<option value="" disabled selected>Select Category</option>' + 
                    filteredCats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

                if (selectedAcc) accSelect.value = selectedAcc;
                if (selectedAccTo) accToSelect.value = selectedAccTo;
                if (selectedCat && filteredCats.some(c => c.id === selectedCat)) catSelect.value = selectedCat;
            };

            function showFeedback(btnId, text) {
                const btn = document.getElementById(btnId);
                const og = btn.innerHTML;
                btn.innerHTML = text;
                btn.classList.replace('bg-brandNavy', 'bg-income');
                setTimeout(() => {
                    btn.innerHTML = og;
                    btn.classList.replace('bg-income', 'bg-brandNavy');
                }, 1000);
            }

            document.getElementById('form-account').addEventListener('submit', e => {
                e.preventDefault();
                state.accounts.push({
                    id: generateId(),
                    name: document.getElementById('acc-name').value.trim(),
                    initialBalance: parseFloat(document.getElementById('acc-balance').value),
                    createdAt: Date.now()
                });
                saveState();
                e.target.reset();
                showFeedback('btn-save-acc', 'Saved ✓');
            });

            document.getElementById('form-category').addEventListener('submit', e => {
                e.preventDefault();
                state.categories.push({
                    id: generateId(),
                    name: document.getElementById('cat-name').value.trim(),
                    type: document.getElementById('cat-type').value,
                    createdAt: Date.now()
                });
                saveState();
                e.target.reset();
                showFeedback('btn-save-cat', 'Saved ✓');
            });

            document.getElementById('form-transaction').addEventListener('submit', e => {
                e.preventDefault();
                const type = document.getElementById('trans-type').value;
                const amt = parseFloat(document.getElementById('trans-amount').value);
                const accId = document.getElementById('trans-account').value;
                const toAccId = document.getElementById('trans-account-to').value;
                const catId = type === 'transfer' ? null : document.getElementById('trans-category').value;
                
                if (type === 'transfer' && accId === toAccId) return alert("Select different accounts.");

                const accIdx = state.accounts.findIndex(a => a.id === accId);
                if (accIdx === -1) return;

                // Balances are now dynamically calculated, so we only push the transaction.
                if (type === 'transfer') {
                    const toIdx = state.accounts.findIndex(a => a.id === toAccId);
                    if (toIdx === -1) return;
                }

                state.transactions.push({
                    id: generateId(), type, amount: amt,
                    accountId: type !== 'transfer' ? accId : undefined,
                    fromAccountId: type === 'transfer' ? accId : undefined,
                    toAccountId: type === 'transfer' ? toAccId : undefined,
                    categoryId: catId,
                    notes: document.getElementById('trans-notes').value.trim(),
                    createdAt: Date.now()
                });

                saveState();
                
                // Reset form
                document.getElementById('trans-amount').value = '';
                document.getElementById('trans-notes').value = '';
                if(document.getElementById('trans-category')) document.getElementById('trans-category').value = '';
                if(document.getElementById('trans-account-to')) document.getElementById('trans-account-to').value = '';
                
                showFeedback('btn-save-trans', 'Saved ✓');
            });

            document.getElementById('form-report').addEventListener('submit', e => {
                e.preventDefault();
                showFeedback('btn-report', 'Generated ✓');
            });

            // Initial render
            renderAll();
        });
    </script>
</body>
</html>
